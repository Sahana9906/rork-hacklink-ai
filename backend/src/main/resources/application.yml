spring:
  application:
    name: hacklink-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hacklink}
    username: ${DATABASE_USERNAME:hacklink}
    password: ${DATABASE_PASSWORD:hacklink}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_REQUEST_SIZE:5MB}

server:
  port: ${PORT:8080}
  error:
    include-message: never

hacklink:
  oauth-encryption-key: ${OAUTH_TOKEN_ENCRYPTION_KEY:development-only-oauth-key-32-characters!}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
